# Used by the `web` service in docker-compose.base44.yml.
# The project root is a static site whose only page is the trading terminal, so
# that page is the directory index and "/" serves it directly.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index Metatrade-Pro-24-Terminal.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
